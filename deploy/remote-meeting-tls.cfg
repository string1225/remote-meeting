global
    log stdout format raw local0
    user haproxy
    group haproxy
    maxconn 1024
defaults
    log global
    mode tcp
    timeout connect 10s
    timeout client 9h
    timeout server 9h
frontend shared_tls
    bind 0.0.0.0:443 ssl crt /etc/remote-meeting/tls.pem ssl-min-ver TLSv1.2 alpn http/1.1
    bind [::]:443 v6only ssl crt /etc/remote-meeting/tls.pem ssl-min-ver TLSv1.2 alpn http/1.1
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.len gt 19 }
    acl is_turn req.payload(4,4) -m bin 2112a442
    use_backend meeting_turn if is_turn
    default_backend existing_https
backend existing_https
    server nginx 127.0.0.1:8443 ssl verify required ca-file /etc/pki/tls/certs/ca-bundle.crt sni str(@TLS_HOST@) send-proxy-v2
backend meeting_turn
    server coturn @TURN_PRIVATE_IP@:3478
